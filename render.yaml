# Render Blueprint Specification for AgroConnect-IoT
# Official Spec: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: agroconnect-db
    databaseName: agroconnect
    user: agroconnect_user
    plan: free # NOTE: Render free tier PostgreSQL expires after 30 days; upgrade to Starter ($7/mo) for permanent retention.

services:
  - type: web
    name: agroconnect-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agroconnect-db
          property: connectionString
      - key: DEVICE_AUTH_TOKEN
        generateValue: true # Render automatically generates a secure cryptographic token

