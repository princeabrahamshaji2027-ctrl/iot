# Render Blueprint Specification for AgroConnect-IoT
# Official Spec: https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: agroconnect-iot-db
    databaseName: agroconnect_iot
    user: agroconnect_user
    plan: free # NOTE: Render free tier PostgreSQL instances expire after 30 days; upgrade to Starter ($7/mo) for permanent retention.

services:
  - type: web
    name: agroconnect-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agroconnect-iot-db
          property: connectionString
      - key: DEVICE_API_TOKEN
        generateValue: true # Render automatically generates a 32+ byte cryptographic secret
